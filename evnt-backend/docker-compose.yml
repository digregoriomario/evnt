services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: evnt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evnt
      POSTGRES_PASSWORD: evnt
      POSTGRES_DB: evnt
    ports:
      - "5433:5432"
    volumes:
      - evnt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evnt -d evnt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evnt-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://evnt:evnt@db:5432/evnt?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    command: sh -c "node -e \"require.resolve('ws')\" >/dev/null 2>&1 || npm install ws @types/ws; npx prisma db push --accept-data-loss && npx prisma db execute --file prisma/sql/postgis.sql --schema prisma/schema.prisma && npm run dev"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

  nginx:
    image: nginx:1.27-alpine
    container_name: evnt-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  evnt_pgdata:
