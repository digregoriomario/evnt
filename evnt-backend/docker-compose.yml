services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: evnt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evnt
      POSTGRES_PASSWORD: evnt
      POSTGRES_DB: evnt
    ports:
      - "5433:5432"
    volumes:
      - evnt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evnt -d evnt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evnt-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://evnt:evnt@db:5432/evnt?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    ports:
      - "4000:4000"
    command: sh -c "npm run db:setup && npm run prisma:generate && npm run bootstrap && npm run dev"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    container_name: evnt-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  evnt_pgdata:
